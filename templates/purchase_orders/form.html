{% extends 'base/dashboard_layout.html' %}

{% block title %}Create Purchase Order - Inventory Management System{% endblock %}

{% block dashboard_content %}
<div class="container-fluid">
    <h1 class="h3 mb-4">Create Purchase Order</h1>

    <div class="card shadow-sm">
        <div class="card-body">
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="supplier" class="form-label">Supplier</label>
                    <select class="form-control" id="supplier" name="supplier_id" required>
                        <option value="">Select a supplier</option>
                        {% for supplier in suppliers %}
                        <option value="{{ supplier.pk }}">{{ supplier.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label for="expected_delivery" class="form-label">Expected Delivery</label>
                    <input type="date" class="form-control" id="expected_delivery" name="expected_delivery" required>
                </div>
                <div class="mb-3">
                    <label for="total_amount" class="form-label">Total Amount</label>
                    <input type="number" class="form-control" id="total_amount" name="total_amount" step="0.01" required>
                </div>
                <div class="mb-3">
                    <label for="notes" class="form-label">Notes</label>
                    <textarea class="form-control" id="notes" name="notes" rows="3"></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Create Order</button>
                <a href="{% url 'purchase_orders:list' %}" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
