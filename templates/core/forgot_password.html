{% extends 'base/auth_layout.html' %}
{% load static %}

{% block title %}Forgot Password - Inventory Management System{% endblock %}

{% block auth_content %}
<form method="POST" class="auth-form">
    {% csrf_token %}
    <p class="text-muted mb-4">Enter your email address and we'll send you a password reset link.</p>
    <div class="mb-3">
        <label for="email" class="form-label">Email Address</label>
        <input type="email" class="form-control" id="email" name="email" required>
    </div>
    <button type="submit" class="btn btn-primary w-100">Send Reset Link</button>
    <div class="text-center mt-3">
        <a href="{% url 'core:login' %}">Back to Login</a>
    </div>
</form>
{% endblock %}
